<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ii–V–I Pivot Cycle · Guitar Trainer</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">↻</span>
      <div>
        <h1>ii–V–I Pivot Cycle</h1>
        <p class="tagline">Each I becomes the next ii · spiraling down by whole step</p>
      </div>
    </div>
    <div id="testBadge" class="test-badge"></div>
  </header>

  <nav class="keymap-wrap">
    <div id="keymap" class="keymap"></div>
  </nav>

  <main>
    <section class="stage">
      <div id="pivotBanner" class="pivot-banner"></div>
      <div class="fretboard-wrap">
        <svg id="fretboard" role="img" aria-label="guitar fretboard"></svg>
      </div>

      <div class="legend">
        <span class="legend-item" data-group="root"><i></i>Root</span>
        <span class="legend-item" data-group="third"><i></i>3rd (♭3 / 3)</span>
        <span class="legend-item" data-group="fifth"><i></i>5th</span>
        <span class="legend-item" data-group="seventh"><i></i>7th (♭7 / 7)</span>
        <span class="legend-note">moved voices glow &amp; carry a ↓</span>
      </div>
    </section>

    <aside class="side">
      <div id="readout" class="readout"></div>

      <div class="modes">
        <span class="modes-label">Practice mode</span>
        <div class="seg">
          <button data-mode="full" class="active">Full cycle</button>
          <button data-mode="iiVI">Single ii–V–I</button>
          <button data-mode="pivot">Pivot drill</button>
        </div>
      </div>

      <div class="transport">
        <button id="btnPrev" class="tbtn" title="Previous (←)">◀</button>
        <button id="btnPlay" class="tbtn primary" title="Play / Pause (Space)">▶ Play</button>
        <button id="btnNext" class="tbtn" title="Next (→)">▶</button>
      </div>

      <div class="audition">
        <button id="btnStrum" class="mini">Strum</button>
        <button id="btnArp" class="mini">Arpeggiate</button>
        <button id="btnShift" class="mini">Position: auto</button>
      </div>

      <div class="tempo">
        <label for="bpm">Tempo <b id="bpmVal">84</b> BPM</label>
        <input id="bpm" type="range" min="40" max="200" value="84" />
      </div>

      <div class="toggles">
        <label><input type="checkbox" id="tglLabel" /> Note names</label>
        <label><input type="checkbox" id="tglGhost" /> Ghost tones</label>
        <label><input type="checkbox" id="tglLoop" checked /> Loop</label>
        <label><input type="checkbox" id="tglMetro" /> Metronome</label>
        <label><input type="checkbox" id="tglHoldI" checked /> Hold I 2 bars</label>
        <label><input type="checkbox" id="tglLefty" /> Left-handed</label>
      </div>

      <div class="hint">Space play/pause · ← → step · L loop</div>
    </aside>
  </main>

  <script src="js/theory.js"></script>
  <script src="js/fretboard.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
